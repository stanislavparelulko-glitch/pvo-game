<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ПВО Стратегия: Заводы и Оборона</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; touch-action: none; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; background: #050b14; }
        
        /* Панель ресурсов */
        #resBar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-around; background: rgba(22, 27, 34, 0.9);
            padding: 8px; border-radius: 8px; border: 1px solid #30363d; font-size: 14px; font-weight: bold;
        }
        .res-item { color: #58a6ff; }
        
        /* Панель управления / Заводы */
        #controlPanel {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            background: rgba(22, 27, 34, 0.95); padding: 10px; border-radius: 8px;
            border: 1px solid #30363d; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        }
        .btn {
            background: #21262d; border: 1px solid #30363d; color: #f0f6fc;
            padding: 8px 4px; border-radius: 6px; font-size: 11px; text-align: center; cursor: pointer;
        }
        .btn:active { background: #30363d; }
        .btn span { display: block; color: #8b949e; font-size: 9px; margin-top: 2px; }

        #gameOver {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: #f85149;
        }
    </style>
</head>
<body>

    <div id="resBar">
        <div class="res-item">⚙️ Металл: <span id="metal">150</span></div>
        <div class="res-item">⚡ Энергия: <span id="energy">50</span></div>
        <div class="res-item">🛡️ База: <span id="hp">100%</span></div>
    </div>

    <div id="controlPanel">
        <div class="btn" onclick="buildFactory('metal')">🏭 Завод Металла<span>100 Металла</span></div>
        <div class="btn" onclick="buildFactory('energy')">⚡ Электростанция<span>80 Металла</span></div>
        <div class="btn" onclick="buildTurret()">🛸 Авто-Турель<span>150М / 50Э</span></div>
        <div class="btn" onclick="useAirstrike()">💥 Авиаудар<span>100 Энергии</span></div>
    </div>

    <div id="gameOver">
        <h1>БАЗА УНИЧТОЖЕНА</h1>
        <button class="btn" style="margin-top:20px; padding:10px 20px; font-size:16px;" onclick="location.reload()">Заново</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        let metal = 150, energy = 50, hp = 100;
        let metalFactories = 1, energyFactories = 1, turrets = [];
        let drones = [], bullets = [], particles = [];

        // Генерация ресурсов заводами
        setInterval(() => {
            metal += metalFactories * 5;
            energy += energyFactories * 3;
            updateUI();
        }, 2000);

        function updateUI() {
            document.getElementById('metal').innerText = metal;
            document.getElementById('energy').innerText = energy;
            document.getElementById('hp').innerText = hp + '%';
        }

        function buildFactory(type) {
            if (type === 'metal' && metal >= 100) {
                metal -= 100; metalFactories++;
            } else if (type === 'energy' && metal >= 80) {
                metal -= 80; energyFactories++;
            }
            updateUI();
        }

        function buildTurret() {
            if (metal >= 150 && energy >= 50) {
                metal -= 150; energy -= 50;
                turrets.push({ x: 50 + turrets.length * 60, y: canvas.height - 120 });
                updateUI();
            }
        }

        function useAirstrike() {
            if (energy >= 100) {
                energy -= 100;
                drones.forEach(d => createExplosion(d.x, d.y, '#ff4444'));
                drones = [];
                updateUI();
            }
        }

        function spawnDrone() {
            const isHeavy = Math.random() > 0.7;
            drones.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                speed: isHeavy ? 1 : 2.5,
                hp: isHeavy ? 3 : 1,
                size: isHeavy ? 20 : 12,
                color: isHeavy ? '#f85149' : '#e3b341'
            });
        }
        setInterval(spawnDrone, 1500);

        canvas.addEventListener('click', (e) => {
            if (e.clientY > canvas.height - 100) return;
            bullets.push({
                x: canvas.width / 2, y: canvas.height - 80,
                vx: (e.clientX - canvas.width / 2) * 0.05,
                vy: (e.clientY - (canvas.height - 80)) * 0.05
            });
        });

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({ x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, alpha: 1, color });
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка Базы и Турелей
            ctx.fillStyle = '#21262d';
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

            turrets.forEach(t => {
                ctx.fillStyle = '#238636';
                ctx.fillRect(t.x - 15, t.y, 30, 20);
                // Автострельба турелей
                if (Math.random() < 0.02 && drones.length > 0) {
                    bullets.push({ x: t.x, y: t.y, vx: (drones[0].x - t.x)*0.03, vy: (drones[0].y - t.y)*0.03 });
                }
            });

            // Пули
            bullets.forEach((b, bi) => {
                b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = '#58a6ff';
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
                if (b.y < 0 || b.x < 0 || b.x > canvas.width) bullets.splice(bi, 1);
            });

            // Дроны
            drones.forEach((d, di) => {
                d.y += d.speed;
                ctx.fillStyle = d.color;
                ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, Math.PI*2); ctx.fill();

                // Попадания
                bullets.forEach((b, bi) => {
                    if (Math.hypot(d.x - b.x, d.y - b.y) < d.size) {
                        d.hp--;
                        bullets.splice(bi, 1);
                        if (d.hp <= 0) {
                            createExplosion(d.x, d.y, d.color);
                            drones.splice(di, 1);
                            metal += 15; updateUI();
                        }
                    }
                });

                // Дошел до базы
                if (d.y > canvas.height - 80) {
                    hp -= 10;
                    drones.splice(di, 1);
                    updateUI();
                    if (hp <= 0) document.getElementById('gameOver').style.display = 'flex';
                }
            });

            // Эффекты
            particles.forEach((p, pi) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
                ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
                if (p.alpha <= 0) particles.splice(pi, 1);
            });

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
