<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ПВО Украины: Стратегия Обороны</title>
    <!-- Подключаем интерактивные карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        #map { width: 100vw; height: 100vh; z-index: 1; }

        /* Верхняя панель ресурсов */
        #topBar {
            position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155; border-radius: 8px;
            padding: 8px 15px; display: flex; justify-content: space-between; align-items: center;
            font-size: 14px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .res-val { color: #38bdf8; }

        /* Нижняя панель техники (Магазин ПВО) */
        #shopPanel {
            position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(15, 23, 42, 0.95); border: 1px solid #334155; border-radius: 10px;
            padding: 8px; display: flex; gap: 8px; overflow-x: auto; box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }
        .unit-card {
            min-width: 90px; background: #1e293b; border: 1px solid #475569; border-radius: 6px;
            padding: 6px; text-align: center; cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .unit-card:hover, .unit-card.active { border-color: #38bdf8; background: #0f172a; }
        .unit-name { font-size: 11px; font-weight: bold; margin-bottom: 2px; }
        .unit-price { font-size: 10px; color: #eab308; }

        .leaflet-container { background: #1e293b; }
    </style>
</head>
<body>

    <div id="topBar">
        <div>💰 Бюджет: <span class="res-val" id="money">3500</span> ₴</div>
        <div>⚡ Энергия: <span class="res-val" id="energy">100</span></div>
        <div>🛡️ Защита: <span class="res-val" id="hp">100%</span></div>
    </div>

    <div id="map"></div>

    <div id="shopPanel">
        <div class="unit-card" onclick="selectUnit('kul', 300, 80)">
            <div class="unit-name">Пулемёт</div>
            <div class="unit-price">💰 300</div>
        </div>
        <div class="unit-card" onclick="selectUnit('kub', 900, 150)">
            <div class="unit-name">2К12 КУБ</div>
            <div class="unit-price">💰 900</div>
        </div>
        <div class="unit-card" onclick="selectUnit('iris', 1200, 220)">
            <div class="unit-name">IRIS-T</div>
            <div class="unit-price">💰 1200</div>
        </div>
        <div class="unit-card" onclick="selectUnit('patriot', 2500, 350)">
            <div class="unit-name">Patriot</div>
            <div class="unit-price">💰 2500</div>
        </div>
        <div class="unit-card" onclick="selectUnit('reb', 500, 120)">
            <div class="unit-name">РЕБ</div>
            <div class="unit-price">💰 500</div>
        </div>
        <div class="unit-card" onclick="selectUnit('radar', 400, 400)">
            <div class="unit-name">Радар</div>
            <div class="unit-price">💰 400</div>
        </div>
    </div>

    <script>
        // Инициализация карты с центром над Украиной
        const map = L.map('map', { zoomControl: false }).setView([48.3794, 31.1656], 6);

        // Тёмный стиль карты
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 10, minZoom: 5
        }).addTo(map);

        let money = 3500, energy = 100, hp = 100;
        let selectedUnit = null;
        let installedUnits = [];
        let drones = [];

        // Каждые 3 секунды добавляется бюджет
        setInterval(() => {
            money += 50;
            document.getElementById('money').innerText = money;
        }, 3000);

        function selectUnit(type, price, range) {
            selectedUnit = { type, price, range };
            document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // Кликом по карте устанавливается выбранное ПВО
        map.on('click', function(e) {
            if (!selectedUnit) return;
            if (money < selectedUnit.price) {
                alert('Недостаточно средств!');
                return;
            }

            money -= selectedUnit.price;
            document.getElementById('money').innerText = money;

            // Отображаем зону радиуса
            const circle = L.circle(e.latlng, {
                color: '#38bdf8',
                fillColor: '#0284c7',
                fillOpacity: 0.15,
                radius: selectedUnit.range * 1000
            }).addTo(map);

            // Иконка установленной установки
            const marker = L.circleMarker(e.latlng, {
                color: '#f8fafc',
                fillColor: '#38bdf8',
                fillOpacity: 1,
                radius: 8
            }).addTo(map);

            installedUnits.push({
                latlng: e.latlng,
                range: selectedUnit.range * 1000,
                type: selectedUnit.type,
                lastShot: 0
            });

            selectedUnit = null;
            document.querySelectorAll('.unit-card').forEach(c => c.classList.remove('active'));
        });

        // Запуск вражеских дронов с востока/севера
        function spawnDrone() {
            const startLat = 48 + (Math.random() - 0.5) * 4;
            const startLng = 38 + (Math.random() - 0.5) * 2; // Границы
            const targetLat = 50.45; const targetLng = 30.52; // Киев

            const marker = L.circleMarker([startLat, startLng], {
                color: '#ef4444', fillColor: '#dc2626', fillOpacity: 1, radius: 5
            }).addTo(map);

            drones.push({
                marker, lat: startLat, lng: startLng,
                targetLat, targetLng, hp: 2
            });
        }
        setInterval(spawnDrone, 2500);

        // Игровой цикл
        setInterval(() => {
            const now = Date.now();

            // Движение дронов
            drones.forEach((d, index) => {
                d.lat += (d.targetLat - d.lat) * 0.005;
                d.lng += (d.targetLng - d.lng) * 0.005;
                d.marker.setLatLng([d.lat, d.lng]);

                // Проверка работы ПВО
                installedUnits.forEach(u => {
                    const dist = map.distance(u.latlng, [d.lat, d.lng]);
                    if (dist < u.range && now - u.lastShot > 1000) {
                        d.hp--;
                        u.lastShot = now;

                        if (d.hp <= 0) {
                            map.removeLayer(d.marker);
                            drones.splice(index, 1);
                            money += 100;
                            document.getElementById('money').innerText = money;
                        }
                    }
                });

                // Долёт до цели
                if (Math.abs(d.lat - d.targetLat) < 0.1 && Math.abs(d.lng - d.targetLng) < 0.1) {
                    map.removeLayer(d.marker);
                    drones.splice(index, 1);
                    hp -= 5;
                    document.getElementById('hp').innerText = hp + '%';
                }
            });
        }, 100);
    </script>
</body>
</html>
